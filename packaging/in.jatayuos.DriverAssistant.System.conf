<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="in.jatayuos.DriverAssistant.System"/>
  </policy>
  <policy context="default">
    <allow send_destination="in.jatayuos.DriverAssistant.System" send_interface="in.jatayuos.DriverAssistant.System1" send_member="GetCapabilities"/>
    <allow send_destination="in.jatayuos.DriverAssistant.System" send_interface="in.jatayuos.DriverAssistant.System1" send_member="RequestAuthorization"/>
    <allow send_destination="in.jatayuos.DriverAssistant.System" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="in.jatayuos.DriverAssistant.System" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
