name: Promote verified Jatayu Driver Assistant v1.2.3 to stable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v1.2.3.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release and promote to latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view v1.2.3 --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets,url
          gh release edit v1.2.3 --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view v1.2.3 --repo "$GITHUB_REPOSITORY" --json isPrerelease,isLatest,url
