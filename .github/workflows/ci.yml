name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies from controlled Debian repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pyside6.qtcore python3-pyside6.qtwidgets python3-setuptools
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m pytest -q tests/
