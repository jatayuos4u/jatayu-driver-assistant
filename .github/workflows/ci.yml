name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install test dependencies from controlled Debian repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pyside6.qtcore python3-pyside6.qtwidgets python3-setuptools
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m pytest -q tests/
